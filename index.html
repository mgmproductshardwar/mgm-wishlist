
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MGM PRODUCTS Wishlist</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:0;background:transparent;color:#fffaf1;font-family:Arial,sans-serif}
.photo{position:relative;width:100%;overflow:hidden}
.photo img{display:block;width:100%;height:auto}
.heart{
 position:absolute;top:12px;right:12px;
 width:43px;height:43px;border-radius:50%;
 border:1px solid rgba(255,255,255,.65);
 background:rgba(25,10,12,.65);
 color:white;font-size:27px;line-height:1;
 cursor:pointer;display:flex;align-items:center;justify-content:center;
 box-shadow:0 2px 8px rgba(0,0,0,.25);
}
.heart.added{color:#e6bd70;background:rgba(25,10,12,.8)}
h2{color:#f1d99d}
#products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px;padding:15px}
.item{background:#1d090d;border:1px solid #8c663c;border-radius:10px;padding:12px}
.item img{width:100%;height:190px;object-fit:contain;background:white;border-radius:6px}
.item h3{font-size:16px;line-height:1.4}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions button,.actions a{padding:9px 12px;border:0;border-radius:5px;text-decoration:none;font-size:13px;cursor:pointer}
.view{background:#d8b56d;color:#250b0b}
.remove{background:#8c2424;color:white}
.whatsapp{background:#168b48;color:white}
.empty{text-align:center;padding:30px 10px;color:#f1d99d}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KEY="mgm_products_wishlist";
const params=new URLSearchParams(location.search);
const mode=params.get("mode")||"wishlist";

function getItems(){
 try{return JSON.parse(localStorage.getItem(KEY))||[]}
 catch(e){return []}
}
function saveItems(items){
 localStorage.setItem(KEY,JSON.stringify(items));
}
function addProduct(product){
 const items=getItems();
 if(!items.some(p=>p.id===product.id)){
  items.push(product);
  saveItems(items);
 }
}
function renderButton(){
 const product={
  id:params.get("id")||"",
  name:params.get("name")||"MGM Product",
  image:params.get("image")||"",
  link:params.get("link")||"https://sites.google.com/view/mgmproducts"
 };
 const app=document.getElementById("app");
 if(!product.id||!product.image){
  app.textContent="Product information missing.";
  return;
 }
 const photo=document.createElement("div");
 photo.className="photo";
 const img=document.createElement("img");
 img.src=product.image;
 img.alt=product.name;
 const heart=document.createElement("button");
 heart.className="heart";
 heart.type="button";
 heart.setAttribute("aria-label","Add to wishlist");
 function updateHeart(){
  const added=getItems().some(p=>p.id===product.id);
  heart.innerHTML=added?"♥":"♡";
  heart.classList.toggle("added",added);
  heart.setAttribute("aria-label",added?"Remove from wishlist":"Add to wishlist");
 }
 heart.addEventListener("click",function(){
  const items=getItems();
  const exists=items.some(p=>p.id===product.id);
  if(exists){
   saveItems(items.filter(p=>p.id!==product.id));
  }else{
   addProduct(product);
  }
  updateHeart();
 });
 photo.append(img,heart);
 app.replaceChildren(photo);
 updateHeart();
}
function renderWishlist(){
 const app=document.getElementById("app");
 const items=getItems();
 if(!items.length){
  app.innerHTML='<h2 style="padding:15px">♥ My Wishlist</h2><div class="empty">Your wishlist is empty.<br>Explore our products and add your favourites!</div>';
  return;
 }
 app.innerHTML='<h2 style="padding:15px 15px 0">♥ My Wishlist</h2><div id="products"></div>';
 const container=document.getElementById("products");
 items.forEach(product=>{
  const card=document.createElement("div");
  card.className="item";
  const img=document.createElement("img");
  img.src=product.image;
  img.alt=product.name;
  img.onerror=()=>img.style.display="none";
  const name=document.createElement("h3");
  name.textContent=product.name;
  const actions=document.createElement("div");
  actions.className="actions";
  const view=document.createElement("a");
  view.className="view";
  view.textContent="View Product";
  view.href=product.link;
  view.target="_blank";
  view.rel="noopener";
  const remove=document.createElement("button");
  remove.className="remove";
  remove.textContent="Remove";
  remove.onclick=()=>{
   saveItems(getItems().filter(p=>p.id!==product.id));
   renderWishlist();
  };
  const whatsapp=document.createElement("a");
  whatsapp.className="whatsapp";
  whatsapp.textContent="WhatsApp Enquiry";
  whatsapp.href="https://wa.me/918393900333?text="+encodeURIComponent("Hello MGM PRODUCTS, I am interested in: "+product.name);
  whatsapp.target="_blank";
  whatsapp.rel="noopener";
  actions.append(view,remove,whatsapp);
  card.append(img,name,actions);
  container.appendChild(card);
 });
}
if(mode==="button"){
 renderButton();
}else{
 renderWishlist();
 window.addEventListener("storage",e=>{
  if(e.key===KEY)renderWishlist();
 });
}
</script>
</body>
</html>
